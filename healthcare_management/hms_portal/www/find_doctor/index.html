{% extends "templates/web.html" %}
{% block title %}Find a Doctor{% endblock %}
{% block page_content %}
<div class="container mt-5">
    <h2>Find a Doctor</h2>
    <div class="row mt-4">
        <div class="col-md-4 mb-3">
            <div class="form-group">
                <label>Department</label>
                <select class="form-control" id="filter-department">
                    <option value="">All Departments</option>
                </select>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="form-group">
                <label>Search by Name</label>
                <input type="text" class="form-control" id="filter-name" placeholder="Doctor name...">
            </div>
        </div>
        <div class="col-md-4 mb-3 d-flex align-items-end">
            <button class="btn btn-primary w-100" id="btn-search">Search</button>
        </div>
    </div>
    <hr>
    <div id="doctor-list" class="row mt-3">
        <p class="text-muted">Loading doctors...</p>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load departments
    frappe.call({
        method: 'frappe.client.get_list',
        args: { doctype: 'Department', fields: ['name'], limit_page_length: 0 },
        callback(r) {
            let sel = document.getElementById('filter-department');
            (r.message || []).forEach(d => {
                sel.innerHTML += `<option value="${d.name}">${d.name}</option>`;
            });
        }
    });

    function loadDoctors() {
        let filters = { is_active: 1 };
        let dept = document.getElementById('filter-department').value;
        let name = document.getElementById('filter-name').value;
        if (dept) filters.department = dept;

        frappe.call({
            method: 'frappe.client.get_list',
            args: {
                doctype: 'Practitioner',
                fields: ['name', 'practitioner_name', 'department', 'designation', 'image'],
                filters: filters,
                limit_page_length: 50
            },
            callback(r) {
                let container = document.getElementById('doctor-list');
                let docs = (r.message || []);
                if (name) {
                    docs = docs.filter(d => d.practitioner_name && d.practitioner_name.toLowerCase().includes(name.toLowerCase()));
                }
                if (!docs.length) {
                    container.innerHTML = '<p class="text-muted col-12">No doctors found matching your criteria.</p>';
                    return;
                }
                container.innerHTML = docs.map(d => `
                    <div class="col-md-4 mb-3">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <img src="${d.image || '/assets/healthcare_management/images/default-doctor.png'}"
                                     class="rounded-circle mb-3" style="width:80px;height:80px;object-fit:cover"
                                     onerror="this.src='/assets/frappe/images/default-avatar.png'">
                                <h5 class="card-title">${d.practitioner_name || d.name}</h5>
                                <p class="text-muted mb-1">${d.designation || ''}</p>
                                <p class="text-muted mb-2">${d.department || ''}</p>
                                <a href="/book-appointment?practitioner=${d.name}" class="btn btn-sm btn-primary">Book Appointment</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        });
    }

    document.getElementById('btn-search').addEventListener('click', loadDoctors);
    loadDoctors();
});
</script>
{% endblock %}
