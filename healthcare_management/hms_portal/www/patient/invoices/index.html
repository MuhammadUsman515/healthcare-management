{% extends "templates/web.html" %}
{% block title %}My Invoices{% endblock %}
{% block page_content %}
<div class="container mt-5">
    <h2>My Invoices & Payments</h2>
    <div id="invoices-list" class="mt-3">
        <p class="text-muted">Loading invoices...</p>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    frappe.call({
        method: 'healthcare_management.hms_portal.api.portal.get_my_invoices',
        callback(r) {
            let bills = r.message || [];
            let container = document.getElementById('invoices-list');
            if (!bills.length) {
                container.innerHTML = '<p class="text-muted">No invoices found.</p>';
                return;
            }
            container.innerHTML = '<table class="table table-bordered"><thead><tr><th>Date</th><th>Bill #</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead><tbody>' +
                bills.map(b => {
                    let badge = {'Draft':'secondary','Submitted':'primary','Paid':'success','Partially Paid':'warning','Cancelled':'dark'}[b.status] || 'info';
                    return `<tr>
                        <td>${b.bill_date || '-'}</td>
                        <td>${b.name}</td>
                        <td>Rs. ${(b.total_charges||0).toLocaleString()}</td>
                        <td>Rs. ${(b.amount_paid||0).toLocaleString()}</td>
                        <td class="${b.balance_due > 0 ? 'text-danger font-weight-bold' : ''}">Rs. ${(b.balance_due||0).toLocaleString()}</td>
                        <td><span class="badge badge-${badge}">${b.status || '-'}</span></td>
                    </tr>`;
                }).join('') +
                '</tbody></table>';
        }
    });
});
</script>
{% endblock %}
