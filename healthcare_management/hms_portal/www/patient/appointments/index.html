{% extends "templates/web.html" %}
{% block title %}My Appointments{% endblock %}
{% block page_content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
        <h2>My Appointments</h2>
        <a href="/book-appointment" class="btn btn-primary">Book New Appointment</a>
    </div>
    <ul class="nav nav-tabs mt-3" id="apt-tabs">
        <li class="nav-item"><a class="nav-link active" data-status="all" href="#">All</a></li>
        <li class="nav-item"><a class="nav-link" data-status="Scheduled" href="#">Upcoming</a></li>
        <li class="nav-item"><a class="nav-link" data-status="Completed" href="#">Completed</a></li>
        <li class="nav-item"><a class="nav-link" data-status="Cancelled" href="#">Cancelled</a></li>
    </ul>
    <div id="appointments-list" class="mt-3">
        <p class="text-muted">Loading appointments...</p>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    function loadAppointments(status) {
        let args = {};
        if (status && status !== 'all') args.status = status;

        frappe.call({
            method: 'healthcare_management.hms_portal.api.portal.get_my_appointments',
            args: args,
            callback(r) {
                let apts = r.message || [];
                let container = document.getElementById('appointments-list');
                if (!apts.length) {
                    container.innerHTML = '<p class="text-muted mt-3">No appointments found.</p>';
                    return;
                }
                container.innerHTML = '<table class="table table-hover"><thead><tr><th>Date</th><th>Time</th><th>Doctor</th><th>Department</th><th>Status</th></tr></thead><tbody>' +
                    apts.map(a => {
                        let badge = {'Scheduled':'primary','Checked In':'info','In Progress':'warning','Completed':'success','Cancelled':'secondary','No Show':'dark','Rescheduled':'light'}[a.status] || 'dark';
                        return `<tr><td>${a.appointment_date}</td><td>${a.appointment_time || '-'}</td><td>${a.practitioner_name || '-'}</td><td>${a.department || '-'}</td><td><span class="badge badge-${badge}">${a.status}</span></td></tr>`;
                    }).join('') +
                    '</tbody></table>';
            }
        });
    }

    document.querySelectorAll('#apt-tabs .nav-link').forEach(tab => {
        tab.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('#apt-tabs .nav-link').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            loadAppointments(this.dataset.status);
        });
    });

    loadAppointments('all');
});
</script>
{% endblock %}
